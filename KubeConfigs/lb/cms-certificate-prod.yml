apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-secret-cms
  namespace: metacity
spec:
  secretName: tls-secret-cms
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: cms.neodao.space
  dnsNames:
  - cms.neodao.space
  duration: 2160h 
  renewBefore: 360h 