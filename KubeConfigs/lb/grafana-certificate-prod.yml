apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: metrics
spec:
  secretName: grafana-tls-secret  
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: grafana.neodao.space
  dnsNames:
  - grafana.neodao.space
  duration: 2160h 
  renewBefore: 360h 
