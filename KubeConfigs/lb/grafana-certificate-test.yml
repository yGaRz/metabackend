apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: metrics
spec:
  secretName: grafana-tls-secret  
  issuerRef:
    name: letsencrypt-test
    kind: ClusterIssuer
  commonName: test.grafana.neodao.space
  dnsNames:
  - test.grafana.neodao.space
  duration: 2160h 
  renewBefore: 360h 
