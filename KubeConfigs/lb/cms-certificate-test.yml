apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-secret-cms
  namespace: metacity
spec:
  secretName: tls-secret-cms
  issuerRef:
    name: letsencrypt-test
    kind: ClusterIssuer
  commonName: test.cms.neodao.space
  dnsNames:
  - test.cms.neodao.space
  duration: 2160h 
  renewBefore: 360h 
