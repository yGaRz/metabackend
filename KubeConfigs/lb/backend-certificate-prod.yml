apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-secret-prod
  namespace: metacity
spec:
  secretName: tls-secret-prod
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: api.neodao.space
  dnsNames:
  - api.neodao.space
  duration: 2160h 
  renewBefore: 360h 
