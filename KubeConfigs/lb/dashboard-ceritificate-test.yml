apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-secret-cms
  namespace: metacity
spec:
  secretName: tls-secret-cms
  issuerRef:
    name: letsencrypt-test
    kind: ClusterIssuer
  commonName: test.k8s.neodao.space
  dnsNames:
  - test.k8s.neodao.space
  privateKey:
    algorithm: RSA  
    size: 2048
  duration: 2160h  
  renewBefore: 360h
