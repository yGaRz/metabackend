global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first.rules"
  # - "second.rules"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["LOCALHOST:9090"] # NOTE HOW ITS NOT LOCALHOST HERE
  - job_name: "my_app"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8081"] # NOTE HOW ITS NOT LOCALHOST HERE